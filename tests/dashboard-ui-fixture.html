<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Dashboard UI Fixture</title>
  <link rel="stylesheet" href="../inventory.css?v=3">
  <link rel="stylesheet" href="../dashboard.css?v=1">
</head>
<body>
<main id="app">
  <button id="home-nav-dashboard">Dashboard</button>
  <nav><button class="restricted-dashboard-nav" data-mainview="dashboard">Dashboard</button><button class="restricted-dashboard-nav" data-mainview="activity-log">Activity</button></nav>
  <section id="view-dashboard" class="view active dashboard-view">
    <div id="dashboard-connection-state"></div><div id="dashboard-error" hidden></div><div id="dashboard-loading" hidden></div>
    <div id="dashboard-content">
      <button id="dashboard-refresh-btn">Refresh</button><div id="dashboard-summary-cards"></div>
      <div id="readiness-formula-note"></div><div id="dashboard-readiness-list"></div>
      <div id="dashboard-roster-panel"><select id="dashboard-project-select"></select><div id="dashboard-roster-filters"></div><div id="dashboard-roster-list"></div></div>
      <button id="view-all-activity-btn">View all activity</button><div id="dashboard-activity-preview"></div>
    </div>
  </section>
  <section id="view-activity-log" class="view activity-view"><div id="activity-connection-state"></div><div id="activity-error" hidden></div><span id="activity-last-refresh"></span><button id="activity-refresh-btn">Refresh</button><div id="activity-cached-note" hidden></div><div id="activity-list"></div></section>
</main>
<script>
  const fixtureLogin = {idNumber:'900001',name:'Test Admin',level:'ADMIN'};
  try { localStorage.setItem('mea_login_v1', JSON.stringify(fixtureLogin)); } catch (e) {}
  try { localStorage.setItem('mea_cfg2', JSON.stringify({url:'/mock-tracker'})); } catch (e) {}
  window.showToast = function () {};
  window.showView = function (view) { document.querySelectorAll('.view').forEach(el => el.classList.toggle('active', el.id === 'view-' + view)); };
  window.fetch = async function (url, options) {
    const action = new URL(url, location.href).searchParams.get('action');
    const payload = action === 'activity' ? {ok:true,events:[],nextCursor:'',revision:'1'} : {
      ok:true,revision:'1',generatedAt:'2026-09-24T00:00:00Z',
      members:[
        {idNumber:'100001',fullName:'Ada One',nickname:'A',department:'SUS',requiresId:true,projects:['ALPHA'],state:'INVENTORY'},
        {idNumber:'100002',fullName:'Bea Two',department:'SUS',requiresId:true,projects:['ALPHA'],state:'DEPLOYED'},
        {idNumber:'100003',fullName:'Cal Three',department:'SUS',requiresId:false,projects:['ALPHA'],state:'NOT_REQUIRED'}
      ],projects:['ALPHA'],rawTabs:{main:[],inventory:[],withProject:[],deployed:[],printing:[]}
    };
    return {ok:true,status:200,text:async()=>JSON.stringify(payload)};
  };
</script>
<script src="../dashboard-rules.js?v=1"></script>
<script src="../dashboard-model.js?v=1"></script>
<script src="../dashboard.js?v=2"></script>
</body>
</html>
